apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: localbasket
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/localbasket-labs/localbasket-workspace.git
    targetRevision: develop
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: localbasket
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
