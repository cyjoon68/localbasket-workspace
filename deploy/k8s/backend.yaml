apiVersion: apps/v1
kind: Deployment
metadata:
  name: localbasket-be
spec:
  replicas: 2
  selector:
    matchLabels:
      app: localbasket-be
  template:
    metadata:
      labels:
        app: localbasket-be
        tags.datadoghq.com/service: localbasket-be
    spec:
      containers:
        - name: api
          image: ghcr.io/localbasket-labs/localbasket-be:develop
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: localbasket-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: localbasket-be
spec:
  selector:
    app: localbasket-be
  ports:
    - port: 8080
      targetPort: 8080
