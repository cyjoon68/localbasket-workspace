apiVersion: apps/v1
kind: Deployment
metadata:
  name: localbasket-fe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localbasket-fe
  template:
    metadata:
      labels:
        app: localbasket-fe
        tags.datadoghq.com/service: localbasket-fe
    spec:
      containers:
        - name: web
          image: ghcr.io/localbasket-labs/localbasket-fe:develop
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: localbasket-fe
spec:
  selector:
    app: localbasket-fe
  ports:
    - port: 8081
      targetPort: 8081
