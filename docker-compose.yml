services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: localbasket
      MYSQL_USER: localbasket
      MYSQL_PASSWORD: localbasket
      MYSQL_ROOT_PASSWORD: localbasket
    ports:
      - "33061:3306"
  redis:
    image: redis:7
    ports:
      - "63791:6379"
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "56721:5672"
      - "15671:15672"
